name: Build and Push Base Images

on:
  push:
    branches: ["main"]
    paths:
      - "images/**"
  workflow_dispatch:
    inputs:
      image:
        description: "Image name to build (leave empty to build all)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changed Images
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has-images: ${{ steps.set-matrix.outputs.has-images }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed images
        id: set-matrix
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT="${{ github.event.inputs.image }}"
            if [ -n "$INPUT" ]; then
              IMAGES="[\"$INPUT\"]"
            else
              IMAGES=$(find images -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
                | jq -R -s -c 'split("\n") | map(select(length > 0))')
            fi
          else
            IMAGES=$(git diff --name-only HEAD~1 HEAD -- 'images/' \
              | grep '^images/' \
              | cut -d/ -f2 \
              | sort -u \
              | jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi

          COUNT=$(echo "$IMAGES" | jq 'length')
          echo "matrix={\"image\":$IMAGES}" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -gt 0 ]; then
            echo "has-images=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-images=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: "Build & Push: ${{ matrix.image }}"
    needs: detect-changes
    if: needs.detect-changes.outputs.has-images == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner
        id: img
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: images/${{ matrix.image }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.img.outputs.owner }}/${{ matrix.image }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.img.outputs.owner }}/${{ matrix.image }}:latest
