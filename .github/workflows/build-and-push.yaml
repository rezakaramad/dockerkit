name: Build and Push Base Images

on:
  push:
    branches: ["main"]
    paths:
      - "images/**"
  pull_request:
    paths:
      - "images/**"
  workflow_dispatch:
    inputs:
      image:
        description: "Image name to build (leave empty to build all)"
        required: false
        default: ""

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect-changes:
    name: Detect Changed Images
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has-images: ${{ steps.set-matrix.outputs.has-images }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed images
        id: set-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_IMAGE: ${{ github.event.inputs.image }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          all_images() {
            find images -mindepth 1 -maxdepth 1 -type d -printf '%f\n'
          }

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "$INPUT_IMAGE" ]; then
              CANDIDATES="$INPUT_IMAGE"
            else
              CANDIDATES=$(all_images)
            fi
          else
            if [ "$EVENT_NAME" = "pull_request" ]; then
              BASE="$PR_BASE"
            else
              BASE="$PUSH_BEFORE"
            fi

            # New branch or unreachable base: build everything.
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              CANDIDATES=$(all_images)
            else
              CANDIDATES=$(git diff --name-only "$BASE" HEAD -- images/ | cut -d/ -f2 | sort -u)
            fi
          fi

          # Keep only images that still exist and have a Dockerfile (skips deleted/invalid ones).
          IMAGES=$(printf '%s\n' "$CANDIDATES" | while read -r name; do
            if [ -n "$name" ] && [ -f "images/$name/Dockerfile" ]; then
              echo "$name"
            fi
          done | jq -R -s -c 'split("\n") | map(select(length > 0))')

          COUNT=$(echo "$IMAGES" | jq 'length')
          echo "matrix={\"image\":$IMAGES}" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -gt 0 ]; then
            echo "has-images=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-images=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: "Build & Push: ${{ matrix.image }}"
    needs: detect-changes
    if: needs.detect-changes.outputs.has-images == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase repository
        id: img
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.img.outputs.repo }}/${{ matrix.image }}
          tags: |
            type=sha
            type=sha,format=long,prefix=
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: images/${{ matrix.image }}
          file: images/${{ matrix.image }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
